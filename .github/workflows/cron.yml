name: Flight Check Cron (오후 2시 KST)

on:
  schedule:
    # 14:00 KST = UTC 05:00 (kor && jp UTC+9)
    - cron: '0 5 * * *'
  workflow_dispatch: # manual button trigger 활성화

jobs:
  trigger-flight-check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Cron API
        run: |
          curl -f -X GET "https://flight-notification.vercel.app/api/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60 \
            --retry 2
          echo "✅ Flight check triggered successfully at $(date)"
